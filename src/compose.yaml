version: '3.8'

services:
  mongodb:
    image: mongo
    container_name: mongodb
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis
    container_name: some-redis
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    ports:
      - '6379:6379'
    restart: unless-stopped
    networks:
      - app-network

  app:
    build:
      context: ./BackendAPI
      dockerfile: Dockerfile
    container_name: node-app
    depends_on:
      - redis
      - mongodb
    ports:
      - '3333:3333'
    env_file:
      - ./BackendAPI/.env
    networks:
      - app-network

  python-app:
    build:
      context: ./DataCollector
      dockerfile: Dockerfile
    container_name: python-app
    depends_on:
      - app
    networks:
      - app-network
    ports:
      - '6969:6969'
    # Uncomment if your python-app should run something immediately (like script.py):
    # command: ["python", "src/script.py"]

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data: